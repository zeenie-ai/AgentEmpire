<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e9dcc0;color:#2a1d14}a{color:#8f3b25}a:hover{color:#b5532f}</style>
</helmet>
<div style="position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);z-index:1;pointer-events:none">
  <aside style="background:#f1e6cc;border-right:1px solid rgba(60,40,20,.25);padding:40px 36px;display:flex;flex-direction:column;gap:24px;box-shadow:inset -20px 0 40px rgba(120,80,30,.08);pointer-events:auto">
    <div>
      <div style="font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.24em;color:#7a5536">ATLAS OF THE REALM · FOLIO {{ lvl.num }}</div>
      <h1 style="margin:14px 0 0;font:400 44px/1 'IM Fell English',serif">Aurelhaven</h1>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ levels }}" as="l" hint-placeholder-count="4">
        <button onClick="{{ l.go }}" style="display:flex;justify-content:space-between;align-items:baseline;border:0;background:none;padding:10px 0;border-bottom:1px dashed rgba(60,40,20,.25);cursor:pointer;color:{{ l.fg }};font:400 21px/1 'IM Fell English',serif;text-align:left">
          <span>{{ l.name }}</span><span style="font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em">{{ l.scale }}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin-top:auto">
      <div style="font:italic 400 18px/1.3 'IM Fell English',serif;color:#8f3b25">{{ lvl.kicker }}</div>
      <p style="margin:10px 0 0;font:400 17px/1.55 'IM Fell English',serif;text-wrap:pretty">{{ lvl.body }}</p>
    </div>
  </aside>
  <div style="position:relative;padding:28px">
    <div style="position:absolute;inset:28px;border:2px solid #3b2a1e;outline:1px solid #3b2a1e;outline-offset:6px;overflow:hidden;background:#cdbb9a">
      <canvas ref="{{ canvasRef }}" style="width:100%;height:100%;display:block;filter:sepia(.35) saturate(.9) contrast(1.05)"></canvas>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(90,60,25,.45));mix-blend-mode:multiply"></div>
      <div style="position:absolute;top:18px;right:18px;width:64px;height:64px;border:1.5px solid #3b2a1e;border-radius:50%;display:grid;place-items:center;font:400 22px/1 'IM Fell English',serif;background:rgba(241,230,204,.85)">N</div>
      <div style="position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(241,230,204,.9);font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em">
        <span style="width:80px;height:6px;border:1px solid #3b2a1e;background:linear-gradient(90deg,#3b2a1e 50%,transparent 50%)"></span>{{ lvl.scale }}
      </div>
    </div>
  </div>
</div>
<div style="height:500vh"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const LV = [
  { name: 'The Continent', scale: '1 : 2,000,000', kicker: 'Ten kingdoms, one capital.', body: 'Hex-marked lowlands, the Ember Hills and the Silt Marches. Every trade road bends toward the four walls in the middle.' },
  { name: 'The Capital', scale: '1 : 40,000', kicker: 'Four rings, seven gates.', body: 'Aurelhaven sits where the river Auren turns. Each ring is the wall of a different era. The newest, the Great Curtain, is the outermost.' },
  { name: 'Guild Quarter', scale: '1 : 4,000', kicker: 'Rank F to Rank S.', body: 'Inside the third ring, quest boards and tanneries share streets with alchemists’ lofts. Most roofs are red slate.' },
  { name: 'The Street', scale: '1 : 200', kicker: 'The Drowned Kettle, est. Y.201.', body: 'A crooked tavern where otherworlders first taste mead. It has a room above the stable and a cat that is said to know magic.' },
];
class Component extends DCLogic {
  state = { s: 0 };
  canvasRef = React.createRef();
  componentDidMount() {
    import('./city-scene.js').then(m => {
      if (!this.canvasRef.current) return;
      this.scene = m.mount(this.canvasRef.current, { hex: true, era: 4, nightFixed: 0, lookY: 0, islands: 0,
        kf: [{ s: 0, r: 3, y: 150, a: 0.2 }, { s: 1, r: 3, y: 62, a: 0.6 }, { s: 2, r: 20, y: 20, a: 1.9 }, { s: 3, r: 13, y: 3.5, a: 2.6 }, { s: 4, r: 12, y: 3, a: 2.8 }] });
      this.scene.setScroll(this.state.s);
    });
    this.onScroll = () => { const s = Math.min(3, scrollY / innerHeight); this.scene && this.scene.setScroll(s); this.setState({ s }); };
    addEventListener('scroll', this.onScroll, { passive: true });
  }
  componentWillUnmount() { removeEventListener('scroll', this.onScroll); this.scene && this.scene.dispose(); }
  renderVals() {
    const i = Math.min(3, Math.round(this.state.s));
    return {
      canvasRef: this.canvasRef,
      lvl: { ...LV[i], num: ['I', 'II', 'III', 'IV'][i] },
      levels: LV.map((l, k) => ({ ...l, fg: k === i ? '#8f3b25' : '#2a1d14', go: () => scrollTo({ top: k * innerHeight, behavior: 'smooth' }) })),
    };
  }
}
</script>
</body>
</html>
